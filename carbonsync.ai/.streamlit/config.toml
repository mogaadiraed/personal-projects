# Theme sections generated by CarbonSync AI from config.yaml (Settings → Appearance).
# Change the look there: the [theme] sections below are rewritten when it changes.

[server]
headless = true
port = 8501
address = "localhost"

[browser]
gatherUsageStats = false

[client]
toolbarMode = "viewer"

[theme]
base = "light"
font = "Inter:https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
baseFontSize = 14
baseRadius = "10px"
buttonRadius = "8px"
showWidgetBorder = true
linkUnderline = false
chartCategoricalColors = ["#2a78d6", "#eb6834", "#1baf7a", "#eda100", "#e87ba4", "#008300", "#6250d6", "#e34948"]

[theme.dark]
primaryColor = "#bc820f"
backgroundColor = "#0e0c09"
secondaryBackgroundColor = "#191712"
textColor = "#eceeef"
linkColor = "#bc820f"
borderColor = "#2d2a25"
dataframeBorderColor = "#2d2a25"

[theme.light]
primaryColor = "#7f580a"
backgroundColor = "#f8f7f5"
secondaryBackgroundColor = "#eeedea"
textColor = "#0b0d10"
linkColor = "#7f580a"
borderColor = "#e2e0dc"
dataframeBorderColor = "#e2e0dc"
